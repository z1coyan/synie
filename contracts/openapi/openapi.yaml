openapi: 3.0.3
info:
  title: Synie API
  version: 0.1.0
  description: Synie ERP Go 主 API。金额与小数在 JSON 中一律使用字符串。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: meta
  - name: base
  - name: todo
  - name: iam
  - name: files
  - name: numbering
  - name: printing
  - name: settings
  - name: sales
  - name: purchase
  - name: hr
  - name: accounting
  - name: inventory
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      responses:
        "200":
          description: 进程和 PostgreSQL 均可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: 当前请求主体
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [system]
      security: []
      responses:
        "200":
          description: 初始化向导门控状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /todos/unread-count:
    get:
      operationId: getTodoUnreadCount
      tags: [todo]
      responses:
        "200":
          description: 当前用户可见且未读的活跃待办数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoUnreadCount"
        "403":
          $ref: "#/components/responses/Error"
  /meta/resources:
    get:
      operationId: listResourceMeta
      tags: [meta]
      responses:
        "200":
          description: 当前 Actor 可读的资源摘要
          content:
            application/json:
              schema:
                type: object
                required: [resources]
                properties:
                  resources:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResourceSummary"
  /meta/resources/{name}:
    parameters:
      - $ref: "#/components/parameters/ResourceName"
    get:
      operationId: getResourceMeta
      tags: [meta]
      responses:
        "200":
          description: 资源 wire Meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceMetaDocument"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /meta/permission-catalog:
    get:
      operationId: getPermissionCatalog
      tags: [meta]
      responses:
        "200":
          description: 权限目录
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/PermissionGroup"
  /base/currencies/query:
    post:
      operationId: queryBasCurrencies
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: 货币分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyList"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /base/currencies:
    post:
      operationId: createBasCurrency
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencyCreate"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /base/currencies/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getBasCurrency
      tags: [base]
      responses:
        "200":
          description: 货币
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateBasCurrency
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencyUpdate"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteBasCurrency
      tags: [base]
      responses:
        "204":
          description: 已删除
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /base/companies/query:
    post:
      operationId: queryBasCompanies
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListQuery" }
      responses:
        "200":
          description: 公司分页结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyList" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /base/companies:
    post:
      operationId: createBasCompany
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyCreate" }
      responses:
        "201":
          description: 已创建，并在同一事务内初始化三个默认仓库
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getBasCompany
      tags: [base]
      responses:
        "200":
          description: 公司
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateBasCompany
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyUpdate" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBasCompany
      tags: [base]
      responses:
        "204": { description: 已删除 }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/units/query:
    post:
      operationId: queryBasUnits
