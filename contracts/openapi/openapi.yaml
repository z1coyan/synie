        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /manufacturing/outputs/{id}/audit:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: auditManufacturingOutput
      tags: [manufacturing]
      responses:
        "200": { description: 已审核, content: { application/json: { schema: { $ref: "#/components/schemas/ManufacturingOutput" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /manufacturing/outputs/{id}/void:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: voidManufacturingOutput
