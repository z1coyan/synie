  /system/storages/query:
    post:
      operationId: querySysStorages
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListQuery" }
      responses:
        "200":
          description: 存储接入分页结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageEndpointList" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /system/storages:
    post:
      operationId: createSysStorage
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageEndpointCreate" }
      responses:
        "201":
          description: 存储接入已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageEndpoint" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /system/storages/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getSysStorage
      tags: [files]
      responses:
        "200":
          description: 存储接入（不返回 Secret Access Key）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageEndpoint" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSysStorage
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageEndpointUpdate" }
      responses:
        "200":
          description: 存储接入已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageEndpoint" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSysStorage
      tags: [files]
      responses:
        "204": { description: 存储接入已删除 }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /system/storages/{id}/set-default:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: setDefaultSysStorage
      tags: [files]
      responses:
        "204": { description: 已设为全局默认存储 }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /settings/supply-chain:
    get:
      operationId: getSalesSetting
      tags: [settings]
      responses:
        "200":
          description: 全局供应链设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesSetting" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSalesSetting
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SalesSettingUpdate" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesSetting" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /settings/production:
    get:
      operationId: getManufacturingSetting
      tags: [settings]
      responses:
        "200":
          description: 全局生产设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingSetting" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateManufacturingSetting
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManufacturingSettingUpdate" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManufacturingSetting" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /settings/finance:
    get:
      operationId: getAccountingSetting
      tags: [settings]
      responses:
        "200":
          description: 全局财务设置（不返回 OCR Secret）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingSetting" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateAccountingSetting
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountingSettingUpdate" }
      responses:
        "200":
          description: 已更新；响应不返回 OCR Secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountingSetting" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /settings/finance/ocr-configured:
    get:
      operationId: getAccountingOCRConfigured
      tags: [settings]
      responses:
        "200":
          description: OCR 双凭证是否均已配置；任意已登录用户可读
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OCRConfigured" }
        "401": { $ref: "#/components/responses/Error" }
  /settings/system:
    get:
      operationId: getSystemSetting
      tags: [settings]
      responses:
        "200":
          description: 全局系统设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSetting" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSystemSetting
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemSettingUpdate" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSetting" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceName:
      name: name
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: 请求失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SalesSetting:
      type: object
      required:
        [id, sampleItemMaxQty, deliveryOvershipRatio, spotItemMaxQty, receiptOverreceiveRatio, demandOverorderRatio, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sampleItemMaxQty: { type: integer, format: int64, minimum: 1 }
        deliveryOvershipRatio: { type: string }
        spotItemMaxQty: { type: integer, format: int64, minimum: 1 }
        receiptOverreceiveRatio: { type: string }
        demandOverorderRatio: { type: string }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SalesSettingUpdate:
      type: object
      additionalProperties: false
      properties:
        sampleItemMaxQty: { type: integer, format: int64, minimum: 1 }
        deliveryOvershipRatio: { type: string }
        spotItemMaxQty: { type: integer, format: int64, minimum: 1 }
        receiptOverreceiveRatio: { type: string }
        demandOverorderRatio: { type: string }
    ManufacturingSetting:
      type: object
      required: [id, outputOverreceiveRatio, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        outputOverreceiveRatio: { type: string }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ManufacturingSettingUpdate:
      type: object
      additionalProperties: false
      properties:
        outputOverreceiveRatio: { type: string }
    AccountingSetting:
      type: object
      required: [id, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ocrAccessKeyId: { type: string, nullable: true, maxLength: 128 }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountingSettingUpdate:
      type: object
      additionalProperties: false
      properties:
        ocrAccessKeyId: { type: string, nullable: true, maxLength: 128 }
        ocrAccessKeySecret: { type: string, writeOnly: true, maxLength: 128 }
    OCRConfigured:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
    SystemSetting:
      type: object
      required:
        [id, marketFetchScheduleEnabled, marketFetchLastIntervalMinutes, marketFetchSettlementEnabled, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        marketFetchScheduleEnabled: { type: boolean }
        marketFetchLastIntervalMinutes:
          type: integer
          enum: [30, 60, 120]
        marketFetchSettlementEnabled: { type: boolean }
        marketFetchLastRunAt: { type: string, format: date-time, nullable: true }
        marketFetchLastSummary: { type: string, nullable: true, maxLength: 500 }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SystemSettingUpdate:
      type: object
      additionalProperties: false
      properties:
        marketFetchScheduleEnabled: { type: boolean }
        marketFetchLastIntervalMinutes:
          type: integer
          enum: [30, 60, 120]
        marketFetchSettlementEnabled: { type: boolean }
    PrintField:
      type: object
      required: [name, label]
      properties:
        name: { type: string }
        label: { type: string }
    PrintLoop:
      type: object
      required: [name, label, fields]
      properties:
        name: { type: string }
        label: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/PrintField" }
    PrintFieldCatalog:
      type: object
      required: [resource, fields, loops]
      properties:
        resource: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/PrintField" }
        loops:
          type: array
          items: { $ref: "#/components/schemas/PrintLoop" }
    PrintResourceList:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          items: { type: string }
    PrintTemplate:
      type: object
      required: [id, name, resource, isDefault, fileId, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        resource: { type: string }
        isDefault: { type: boolean }
        remarks: { type: string, nullable: true }
        fileId: { type: string, format: uuid }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PrintTemplateCreate:
      type: object
      additionalProperties: false
      required: [name, resource, fileId]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        resource: { type: string, minLength: 1, maxLength: 64 }
        fileId: { type: string, format: uuid }
        remarks: { type: string, nullable: true }
    PrintTemplateUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        fileId: { type: string, format: uuid }
        remarks: { type: string, nullable: true }
    PrintTemplateList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/PrintTemplate" }
    NumberingSegment:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [text, field, seq]
        value: { type: string }
        field: { type: string }
        label: { type: string }
        format: { type: string }
        padding: { type: integer, minimum: 0, maximum: 12 }
    NumberingRule:
      type: object
      required: [id, resource, name, segments, perCompany, enabled, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        resource: { type: string }
        name: { type: string }
        segments:
          type: array
          items: { $ref: "#/components/schemas/NumberingSegment" }
        perCompany: { type: boolean }
        enabled: { type: boolean }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NumberingRuleCreate:
      type: object
      additionalProperties: false
      required: [resource, name, segments]
      properties:
        resource: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 64 }
        segments:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/NumberingSegment" }
        perCompany: { type: boolean, default: true }
        enabled: { type: boolean, default: true }
    NumberingRuleUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        segments:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/NumberingSegment" }
        perCompany: { type: boolean }
        enabled: { type: boolean }
    NumberingRuleList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/NumberingRule" }
    NumberingCounter:
      type: object
      required: [id, ruleId, scopeKey, value, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        scopeKey: { type: string }
        value: { type: integer, format: int64, minimum: 0 }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NumberingCounterUpdate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: integer, format: int64, minimum: 0 }
    NumberingCounterList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/NumberingCounter" }
    NumberableField:
      type: object
      required: [path, label, type]
      properties:
        path: { type: string }
        label: { type: string }
        type:
          type: string
          enum: [string, integer, decimal, boolean, date, datetime, enum, enumArray, uuid, json]
    NumberableResource:
      type: object
      required: [prefix, grid, fields]
      properties:
        prefix: { type: string }
        grid: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/NumberableField" }
    NumberableResourceList:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/NumberableResource" }
    StoredFile:
      type: object
      required: [id, storage, key, filename, size, sha256, insertedAt]
      properties:
        id: { type: string, format: uuid }
        storage: { type: string }
        key: { type: string }
        filename: { type: string }
        contentType: { type: string, nullable: true }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        insertedAt: { type: string, format: date-time }
        uploadedById: { type: string, format: uuid, nullable: true }
    StoredFileList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/StoredFile" }
    FileUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        ownerType: { type: string }
        ownerId: { type: string, format: uuid }
        category: { type: string }
    FileUploadResult:
      type: object
      required: [file]
      properties:
        file: { $ref: "#/components/schemas/StoredFile" }
        attachment:
          allOf:
            - $ref: "#/components/schemas/Attachment"
          nullable: true
    Attachment:
      type: object
      required: [id, fileId, ownerType, ownerId, category, insertedAt]
      properties:
        id: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        ownerType: { type: string }
        ownerId: { type: string, format: uuid }
        category: { type: string }
        companyId: { type: string, format: uuid, nullable: true }
        insertedAt: { type: string, format: date-time }
        file:
          allOf:
            - $ref: "#/components/schemas/StoredFile"
          nullable: true
    AttachmentCreate:
      type: object
      required: [ownerType, ownerId]
      properties:
        ownerType: { type: string }
        ownerId: { type: string, format: uuid }
        category: { type: string }
    AttachmentQuery:
      type: object
      properties:
        limit: { type: integer, minimum: 1, maximum: 200, default: 200 }
        offset: { type: integer, minimum: 0, default: 0 }
        fileId: { type: string, format: uuid }
        ownerType: { type: string }
        ownerId: { type: string, format: uuid }
        category: { type: string }
    AttachmentList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
    StorageKind:
      type: string
      enum: [LOCAL, S3, OSS]
    StorageEndpoint:
      type: object
      required:
        [id, name, label, kind, secretConfigured, builtin, isDefault, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        label: { type: string }
        kind: { $ref: "#/components/schemas/StorageKind" }
        root: { type: string, nullable: true }
        endpoint: { type: string, nullable: true }
        region: { type: string, nullable: true }
        bucket: { type: string, nullable: true }
        prefix: { type: string, nullable: true }
        accessKeyId: { type: string, nullable: true }
        secretConfigured: { type: boolean }
        builtin: { type: boolean }
        isDefault: { type: boolean }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StorageEndpointList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/StorageEndpoint" }
    StorageEndpointCreate:
      type: object
      required: [name, label, kind]
      properties:
        name: { type: string, maxLength: 32 }
        label: { type: string, maxLength: 64 }
        kind: { $ref: "#/components/schemas/StorageKind" }
        root: { type: string, nullable: true }
        endpoint: { type: string, nullable: true }
        region: { type: string, nullable: true }
        bucket: { type: string, nullable: true }
        prefix: { type: string, nullable: true }
        accessKeyId: { type: string, nullable: true }
        secretAccessKey: { type: string, writeOnly: true }
    StorageEndpointUpdate:
      type: object
      properties:
        label: { type: string, maxLength: 64 }
        root: { type: string, nullable: true }
        endpoint: { type: string, nullable: true }
        region: { type: string, nullable: true }
        bucket: { type: string, nullable: true }
        prefix: { type: string, nullable: true }
        accessKeyId: { type: string, nullable: true }
        secretAccessKey: { type: string, writeOnly: true }
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]
    SetupStatus:
      type: object
      required: [initialized, hasUsers]
      properties:
        initialized:
          type: boolean
        hasUsers:
          type: boolean
    TodoUnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
          format: int64
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/APIError"
    APIError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [unauthorized, rate_limited, forbidden, validation, not_found, conflict, not_implemented, internal]
        message:
          type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
    SessionUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
          nullable: true
    LoginResponse:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/SessionUser"
    MeResponse:
      type: object
      required: [user, superAdmin, allCompanies, permissions, companyIds]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        superAdmin:
          type: boolean
        allCompanies:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        companyIds:
          type: array
          items:
            type: string
            format: uuid
    ResourceSummary:
      type: object
      required: [name, permissionPrefix, permissionLabel]
      properties:
        name:
          type: string
        permissionPrefix:
          type: string
        permissionLabel:
          type: string
    ResourceMetaDocument:
      type: object
      required: [name, grid]
      properties:
        name:
          type: string
        grid:
          $ref: "#/components/schemas/GridMeta"
        form:
          $ref: "#/components/schemas/FormMeta"
    GridMeta:
      type: object
      required: [columns, capabilities, extendedActions]
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/GridColumn"
        capabilities:
          type: array
          items:
            type: string
        extendedActions:
          type: array
          items:
            $ref: "#/components/schemas/GridAction"
        destroyMutation:
          type: string
          nullable: true
    GridColumn:
      type: object
      required: [name, type, label, sortable, filterable]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [string, integer, decimal, boolean, date, datetime, enum, enumArray, fk]
        label:
          type: string
        sortable:
          type: boolean
        filterable:
          type: boolean
        enumOptions:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/EnumOption"
        ref:
          allOf:
            - $ref: "#/components/schemas/GridColumnRef"
          nullable: true
    EnumOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: string
        label:
          type: string
    GridColumnRef:
      type: object
      properties:
        resource:
          type: string
          nullable: true
        relation:
          type: string
          nullable: true
        labelField:
          type: string
          nullable: true
        discriminator:
          type: string
          nullable: true
        discriminatorType:
          type: string
          enum: [enum, string]
          nullable: true
        variants:
          type: array
          nullable: true
