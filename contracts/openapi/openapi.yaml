        "200": { description: 生产入库行分页结果, content: { application/json: { schema: { $ref: "#/components/schemas/ManufacturingOutputItemList" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /manufacturing/output-items:
    post:
      operationId: createManufacturingOutputItem
      tags: [manufacturing]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ManufacturingOutputItemCreate" } } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/ManufacturingOutputItem" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /manufacturing/output-items/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getManufacturingOutputItem
      tags: [manufacturing]
      responses:
        "200": { description: 生产入库行, content: { application/json: { schema: { $ref: "#/components/schemas/ManufacturingOutputItem" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateManufacturingOutputItem
      tags: [manufacturing]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ManufacturingOutputItemUpdate" } } } }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/ManufacturingOutputItem" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
