    delete:
      operationId: deleteManufacturingOutputItem
      tags: [manufacturing]
      responses:
        "204": { description: 已删除 }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /settings/system:
    get:
      operationId: getSystemSetting
      tags: [settings]
      responses:
        "200":
          description: 全局系统设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSetting" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateSystemSetting
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemSettingUpdate" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemSetting" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceName:
      name: name
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: 请求失败
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SalesSetting:
      type: object
      required:
        [id, sampleItemMaxQty, deliveryOvershipRatio, spotItemMaxQty, receiptOverreceiveRatio, demandOverorderRatio, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sampleItemMaxQty: { type: integer, format: int64, minimum: 1 }
        deliveryOvershipRatio: { type: string }
        spotItemMaxQty: { type: integer, format: int64, minimum: 1 }
        receiptOverreceiveRatio: { type: string }
        demandOverorderRatio: { type: string }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SalesSettingUpdate:
      type: object
      additionalProperties: false
      properties:
        sampleItemMaxQty: { type: integer, format: int64, minimum: 1 }
        deliveryOvershipRatio: { type: string }
        spotItemMaxQty: { type: integer, format: int64, minimum: 1 }
        receiptOverreceiveRatio: { type: string }
        demandOverorderRatio: { type: string }
    ManufacturingSetting:
      type: object
      required: [id, outputOverreceiveRatio, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        outputOverreceiveRatio: { type: string }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ManufacturingSettingUpdate:
      type: object
      additionalProperties: false
      properties:
        outputOverreceiveRatio: { type: string }
    AccountingSetting:
      type: object
      required: [id, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ocrAccessKeyId: { type: string, nullable: true, maxLength: 128 }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AccountingSettingUpdate:
      type: object
      additionalProperties: false
      properties:
        ocrAccessKeyId: { type: string, nullable: true, maxLength: 128 }
        ocrAccessKeySecret: { type: string, writeOnly: true, maxLength: 128 }
    OCRConfigured:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
    SystemSetting:
      type: object
      required:
        [id, marketFetchScheduleEnabled, marketFetchLastIntervalMinutes, marketFetchSettlementEnabled, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        marketFetchScheduleEnabled: { type: boolean }
        marketFetchLastIntervalMinutes:
          type: integer
          enum: [30, 60, 120]
        marketFetchSettlementEnabled: { type: boolean }
        marketFetchLastRunAt: { type: string, format: date-time, nullable: true }
        marketFetchLastSummary: { type: string, nullable: true, maxLength: 500 }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SystemSettingUpdate:
      type: object
      additionalProperties: false
      properties:
        marketFetchScheduleEnabled: { type: boolean }
        marketFetchLastIntervalMinutes:
          type: integer
          enum: [30, 60, 120]
        marketFetchSettlementEnabled: { type: boolean }
    PrintField:
      type: object
      required: [name, label]
      properties:
        name: { type: string }
        label: { type: string }
    PrintLoop:
      type: object
      required: [name, label, fields]
      properties:
        name: { type: string }
        label: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/PrintField" }
    PrintFieldCatalog:
      type: object
      required: [resource, fields, loops]
      properties:
        resource: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/PrintField" }
        loops:
          type: array
          items: { $ref: "#/components/schemas/PrintLoop" }
    PrintResourceList:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          items: { type: string }
    PrintTemplate:
      type: object
      required: [id, name, resource, isDefault, fileId, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        resource: { type: string }
        isDefault: { type: boolean }
        remarks: { type: string, nullable: true }
        fileId: { type: string, format: uuid }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PrintTemplateCreate:
      type: object
      additionalProperties: false
      required: [name, resource, fileId]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        resource: { type: string, minLength: 1, maxLength: 64 }
        fileId: { type: string, format: uuid }
        remarks: { type: string, nullable: true }
    PrintTemplateUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        fileId: { type: string, format: uuid }
        remarks: { type: string, nullable: true }
    PrintTemplateList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/PrintTemplate" }
    PrintRenderRequest:
      type: object
      additionalProperties: false
      required: [resource, ids, templateId, mode]
      properties:
        resource: { type: string, minLength: 1, maxLength: 64 }
        ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
        templateId: { type: string, format: uuid }
        mode: { type: string, enum: [print, export] }
    NumberingSegment:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          type: string
          enum: [text, field, seq]
        value: { type: string }
        field: { type: string }
        label: { type: string }
        format: { type: string }
        padding: { type: integer, minimum: 0, maximum: 12 }
    NumberingRule:
      type: object
      required: [id, resource, name, segments, perCompany, enabled, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        resource: { type: string }
        name: { type: string }
        segments:
          type: array
          items: { $ref: "#/components/schemas/NumberingSegment" }
        perCompany: { type: boolean }
        enabled: { type: boolean }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NumberingRuleCreate:
      type: object
      additionalProperties: false
      required: [resource, name, segments]
      properties:
        resource: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 64 }
        segments:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/NumberingSegment" }
        perCompany: { type: boolean, default: true }
        enabled: { type: boolean, default: true }
    NumberingRuleUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        segments:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/NumberingSegment" }
        perCompany: { type: boolean }
        enabled: { type: boolean }
    NumberingRuleList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/NumberingRule" }
    NumberingCounter:
      type: object
      required: [id, ruleId, scopeKey, value, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ruleId: { type: string, format: uuid }
        scopeKey: { type: string }
        value: { type: integer, format: int64, minimum: 0 }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    NumberingCounterUpdate:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: integer, format: int64, minimum: 0 }
    NumberingCounterList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/NumberingCounter" }
    NumberableField:
      type: object
      required: [path, label, type]
      properties:
        path: { type: string }
        label: { type: string }
        type:
          type: string
          enum: [string, integer, decimal, boolean, date, datetime, enum, enumArray, uuid, json]
    NumberableResource:
      type: object
      required: [prefix, grid, fields]
      properties:
        prefix: { type: string }
        grid: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/NumberableField" }
    NumberableResourceList:
      type: object
      required: [resources]
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/NumberableResource" }
    StoredFile:
      type: object
      required: [id, storage, key, filename, size, sha256, insertedAt]
      properties:
        id: { type: string, format: uuid }
        storage: { type: string }
        key: { type: string }
        filename: { type: string }
        contentType: { type: string, nullable: true }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        insertedAt: { type: string, format: date-time }
        uploadedById: { type: string, format: uuid, nullable: true }
    StoredFileList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/StoredFile" }
    FileUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        ownerType: { type: string }
        ownerId: { type: string, format: uuid }
        category: { type: string }
    FileUploadResult:
      type: object
      required: [file]
      properties:
        file: { $ref: "#/components/schemas/StoredFile" }
        attachment:
          allOf:
            - $ref: "#/components/schemas/Attachment"
          nullable: true
    Attachment:
      type: object
      required: [id, fileId, ownerType, ownerId, category, insertedAt]
      properties:
        id: { type: string, format: uuid }
        fileId: { type: string, format: uuid }
        ownerType: { type: string }
        ownerId: { type: string, format: uuid }
        category: { type: string }
        companyId: { type: string, format: uuid, nullable: true }
        insertedAt: { type: string, format: date-time }
        file:
          allOf:
            - $ref: "#/components/schemas/StoredFile"
          nullable: true
    AttachmentCreate:
      type: object
      required: [ownerType, ownerId]
      properties:
        ownerType: { type: string }
        ownerId: { type: string, format: uuid }
        category: { type: string }
    AttachmentQuery:
      type: object
      properties:
        limit: { type: integer, minimum: 1, maximum: 200, default: 200 }
        offset: { type: integer, minimum: 0, default: 0 }
        fileId: { type: string, format: uuid }
        ownerType: { type: string }
        ownerId: { type: string, format: uuid }
        category: { type: string }
    AttachmentList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
    StorageKind:
      type: string
      enum: [LOCAL, S3, OSS]
    StorageEndpoint:
      type: object
      required:
        [id, name, label, kind, secretConfigured, builtin, isDefault, insertedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        label: { type: string }
        kind: { $ref: "#/components/schemas/StorageKind" }
        root: { type: string, nullable: true }
        endpoint: { type: string, nullable: true }
        region: { type: string, nullable: true }
        bucket: { type: string, nullable: true }
        prefix: { type: string, nullable: true }
        accessKeyId: { type: string, nullable: true }
        secretConfigured: { type: boolean }
        builtin: { type: boolean }
        isDefault: { type: boolean }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StorageEndpointList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/StorageEndpoint" }
    StorageEndpointCreate:
      type: object
      required: [name, label, kind]
      properties:
        name: { type: string, maxLength: 32 }
        label: { type: string, maxLength: 64 }
        kind: { $ref: "#/components/schemas/StorageKind" }
        root: { type: string, nullable: true }
        endpoint: { type: string, nullable: true }
        region: { type: string, nullable: true }
        bucket: { type: string, nullable: true }
        prefix: { type: string, nullable: true }
        accessKeyId: { type: string, nullable: true }
        secretAccessKey: { type: string, writeOnly: true }
    StorageEndpointUpdate:
      type: object
      properties:
        label: { type: string, maxLength: 64 }
        root: { type: string, nullable: true }
        endpoint: { type: string, nullable: true }
        region: { type: string, nullable: true }
        bucket: { type: string, nullable: true }
        prefix: { type: string, nullable: true }
        accessKeyId: { type: string, nullable: true }
        secretAccessKey: { type: string, writeOnly: true }
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [ok]
    SetupStatus:
      type: object
      required: [initialized, hasUsers]
      properties:
        initialized:
          type: boolean
        hasUsers:
          type: boolean
    SetupFirstUserRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: string
          nullable: true
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
    SetupSeedCurrenciesResponse:
      type: object
      required: [created]
      properties:
        created:
          type: integer
          minimum: 0
    SetupActivateBaseCurrencyRequest:
      type: object
      additionalProperties: false
      required: [currencyId]
      properties:
        currencyId:
          type: string
          format: uuid
    SetupCompleteRequest:
      type: object
      additionalProperties: false
      required: [preferredLanguage]
      properties:
        preferredLanguage:
          type: string
          enum: [zh-CN, en-US]
        seedSampleData:
          type: boolean
          default: false
    SetupSuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    TodoUnreadCount:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          minimum: 0
          format: int64
    TodoQuery:
      type: object
      additionalProperties: false
      properties:
        tab:
          type: string
          enum: [active, history, recent]
          default: active
        includeDismissed:
          type: boolean
          default: false
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
        offset:
          type: integer
          minimum: 0
          default: 0
        search:
          type: string
          maxLength: 256
        sort:
          $ref: "#/components/schemas/Sort"
        filter:
          $ref: "#/components/schemas/FilterState"
    TodoCompanyReference:
      type: object
      required: [id, name, shortName]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        shortName: { type: string, nullable: true }
    TodoUserReference:
      type: object
      required: [id, username, name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        name: { type: string, nullable: true }
    Todo:
      type: object
      required:
        [id, type, sourceType, sourceId, sourceNo, partyType, partyId, partyName,
         amount, status, closedReason, sourceChangedAt, closedAt, insertedAt, updatedAt,
         draftInvoiceLinked, myReadAt, myDismissedAt, dismissed, companyId, createdById,
         company, createdBy]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [ISSUE_INVOICE, RECEIVE_INVOICE]
        sourceType: { type: string }
        sourceId: { type: string, format: uuid }
        sourceNo: { type: string, maxLength: 64 }
        partyType: { type: string }
        partyId: { type: string, format: uuid }
        partyName: { type: string }
        amount:
          type: string
          pattern: "^-?[0-9]+(\\.[0-9]+)?$"
        status:
          type: string
          enum: [ACTIVE, CLOSED]
        closedReason:
          type: string
          enum: [UNCONFIRM, INVOICE_AUDIT]
          nullable: true
        sourceChangedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        insertedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        draftInvoiceLinked: { type: boolean }
        myReadAt: { type: string, format: date-time, nullable: true }
        myDismissedAt: { type: string, format: date-time, nullable: true }
        dismissed: { type: boolean }
        companyId: { type: string, format: uuid }
        createdById: { type: string, format: uuid, nullable: true }
        company:
          allOf:
            - $ref: "#/components/schemas/TodoCompanyReference"
          nullable: true
        createdBy:
          allOf:
            - $ref: "#/components/schemas/TodoUserReference"
          nullable: true
    TodoList:
      type: object
      required: [count, results]
      properties:
        count: { type: integer, format: int64 }
        results:
          type: array
          items: { $ref: "#/components/schemas/Todo" }
    SystemAuditLog:
      type: object
      required:
        [id, insertedAt, resource, recordId, recordLabel, actionType, actionName,
         actorId, actorName, companyId, changes]
      properties:
        id: { type: string, format: uuid }
        insertedAt: { type: string, format: date-time }
        resource: { type: string }
        recordId: { type: string, format: uuid }
        recordLabel: { type: string, nullable: true }
        actionType: { type: string }
        actionName: { type: string }
        actorId: { type: string, format: uuid, nullable: true }
        actorName: { type: string, nullable: true }
        companyId: { type: string, format: uuid, nullable: true }
        changes:
          type: object
          additionalProperties: true
    SystemAuditLogQuery:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
        offset:
          type: integer
          minimum: 0
          default: 0
        search:
          type: string
          maxLength: 256
        sort:
