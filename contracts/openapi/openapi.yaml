openapi: 3.0.3
info:
  title: Synie API
  version: 0.1.0
  description: Synie ERP Go 主 API。金额与小数在 JSON 中一律使用字符串。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: system
  - name: auth
  - name: meta
  - name: base
  - name: todo
  - name: iam
  - name: files
  - name: numbering
  - name: printing
  - name: settings
  - name: sales
  - name: purchase
  - name: scm
  - name: manufacturing
  - name: hr
  - name: accounting
  - name: inventory
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [system]
      security: []
      responses:
        "200":
          description: 进程和 PostgreSQL 均可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: 当前请求主体
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
  /setup/status:
    get:
      operationId: getSetupStatus
      tags: [system]
      security: []
      responses:
        "200":
          description: 初始化向导门控状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
  /setup/first-user:
    post:
      operationId: createSetupFirstUser
      tags: [system]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupFirstUserRequest"
      responses:
        "201":
          description: 首个超级管理员创建成功并签发登录态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /setup/currencies/seed-common:
    post:
      operationId: seedSetupCommonCurrencies
      tags: [system]
      responses:
        "200":
          description: 常用货币幂等预置结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSeedCurrenciesResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /setup/currencies/activate-base:
    post:
      operationId: activateSetupBaseCurrency
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupActivateBaseCurrencyRequest"
      responses:
        "200":
          description: 仅选定本币保持启用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSuccessResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /setup/complete:
    post:
      operationId: completeSetup
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupCompleteRequest"
      responses:
        "200":
          description: 初始化完成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupSuccessResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "501":
          $ref: "#/components/responses/Error"
  /todos/unread-count:
    get:
      operationId: getTodoUnreadCount
      tags: [todo]
      responses:
        "200":
          description: 当前用户可见且未读的活跃待办数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoUnreadCount"
        "403":
          $ref: "#/components/responses/Error"
  /todos/query:
    post:
      operationId: queryTodos
      tags: [todo]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoQuery"
      responses:
        "200":
          description: 当前用户可见的待办列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoList"
        "403":
          $ref: "#/components/responses/Error"
  /todos/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: markTodoRead
      tags: [todo]
      responses:
        "200":
          description: 已读后的待办
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /todos/{id}/dismiss:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: dismissTodo
      tags: [todo]
      responses:
        "200":
          description: 忽略后的待办
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Todo"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /system/audit-logs/query:
    post:
      operationId: querySystemAuditLogs
      tags: [system, audit]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemAuditLogQuery"
      responses:
        "200":
          description: 当前 Actor 可见的操作日志
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAuditLogList"
        "403":
          $ref: "#/components/responses/Error"
  /system/audit-logs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getSystemAuditLog
      tags: [system, audit]
      responses:
        "200":
          description: 操作日志详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAuditLog"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /meta/resources:
    get:
      operationId: listResourceMeta
      tags: [meta]
      responses:
        "200":
          description: 当前 Actor 可读的资源摘要
          content:
            application/json:
              schema:
                type: object
                required: [resources]
                properties:
                  resources:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResourceSummary"
  /meta/resources/{name}:
    parameters:
      - $ref: "#/components/parameters/ResourceName"
    get:
      operationId: getResourceMeta
      tags: [meta]
      responses:
        "200":
          description: 资源 wire Meta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceMetaDocument"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /meta/permission-catalog:
    get:
      operationId: getPermissionCatalog
      tags: [meta]
      responses:
        "200":
          description: 权限目录
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/PermissionGroup"
  /base/currencies/query:
    post:
      operationId: queryBasCurrencies
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListQuery"
      responses:
        "200":
          description: 货币分页结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyList"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /base/currencies:
    post:
      operationId: createBasCurrency
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencyCreate"
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /base/currencies/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getBasCurrency
      tags: [base]
      responses:
        "200":
          description: 货币
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateBasCurrency
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencyUpdate"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Currency"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteBasCurrency
      tags: [base]
      responses:
        "204":
          description: 已删除
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /base/companies/query:
    post:
      operationId: queryBasCompanies
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListQuery" }
      responses:
        "200":
          description: 公司分页结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyList" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /base/companies:
    post:
      operationId: createBasCompany
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyCreate" }
      responses:
        "201":
          description: 已创建，并在同一事务内初始化三个默认仓库
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/companies/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getBasCompany
      tags: [base]
      responses:
        "200":
          description: 公司
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateBasCompany
      tags: [base]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyUpdate" }
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Company" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBasCompany
      tags: [base]
      responses:
        "204": { description: 已删除 }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/units/query:
    post:
      operationId: queryBasUnits
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ListQuery" } } } }
      responses:
        "200": { description: 单位分页结果, content: { application/json: { schema: { $ref: "#/components/schemas/UnitList" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /base/units:
    post:
      operationId: createBasUnit
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UnitCreate" } } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/Unit" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/units/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getBasUnit
      tags: [base]
      responses:
        "200": { description: 计量单位, content: { application/json: { schema: { $ref: "#/components/schemas/Unit" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateBasUnit
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/UnitUpdate" } } } }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/Unit" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBasUnit
      tags: [base]
      responses:
        "204": { description: 已删除 }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/market-instruments/query:
    post:
      operationId: queryBasMarketInstruments
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ListQuery" } } } }
      responses:
        "200": { description: 行情品种分页结果, content: { application/json: { schema: { $ref: "#/components/schemas/MarketInstrumentList" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /base/market-instruments:
    post:
      operationId: createBasMarketInstrument
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MarketInstrumentCreate" } } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/MarketInstrument" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/market-instruments/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getBasMarketInstrument
      tags: [base]
      responses:
        "200": { description: 行情品种, content: { application/json: { schema: { $ref: "#/components/schemas/MarketInstrument" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateBasMarketInstrument
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MarketInstrumentUpdate" } } } }
      responses:
        "200": { description: 已更新, content: { application/json: { schema: { $ref: "#/components/schemas/MarketInstrument" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteBasMarketInstrument
      tags: [base]
      responses:
        "204": { description: 已删除 }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/market-price-points/query:
    post:
      operationId: queryBasMarketPricePoints
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ListQuery" } } } }
      responses:
        "200": { description: 行情价点分页结果, content: { application/json: { schema: { $ref: "#/components/schemas/MarketPricePointList" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /base/market-price-points:
    post:
      operationId: createBasMarketPricePoint
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MarketPricePointCreate" } } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/MarketPricePoint" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/market-price-points/chart-instruments:
    get:
      operationId: getBasMarketChartInstruments
      tags: [base]
      responses:
        "200":
          description: 启用的行情图品种
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketChartInstrument" }
        "403": { $ref: "#/components/responses/Error" }
  /base/market-price-points/price-series:
    post:
      operationId: getBasMarketPriceSeries
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MarketPriceSeriesQuery" } } } }
      responses:
        "200": { description: 行情价点序列, content: { application/json: { schema: { $ref: "#/components/schemas/MarketPriceSeries" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /base/market-price-points/refresh:
    post:
      operationId: refreshBasMarketPricePoints
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/MarketRefreshRequest" } } } }
      responses:
        "200": { description: 行情刷新结果, content: { application/json: { schema: { $ref: "#/components/schemas/MarketRefreshResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /base/market-price-points/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getBasMarketPricePoint
      tags: [base]
      responses:
        "200": { description: 行情价点, content: { application/json: { schema: { $ref: "#/components/schemas/MarketPricePoint" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /base/market-price-points/{id}/void:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      operationId: voidBasMarketPricePoint
      tags: [base]
      responses:
        "200": { description: 已作废, content: { application/json: { schema: { $ref: "#/components/schemas/MarketPricePoint" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/accounts/query:
    post:
      operationId: queryBasAccounts
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ListQuery" } } } }
      responses:
        "200": { description: 会计科目分页结果, content: { application/json: { schema: { $ref: "#/components/schemas/AccountList" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /base/accounts:
    post:
      operationId: createBasAccount
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AccountCreate" } } } }
      responses:
        "201": { description: 已创建, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/accounts/init-template:
    post:
      operationId: initializeBasAccountsTemplate
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AccountTemplateInitialize" } } } }
      responses:
        "201": { description: 模板已初始化, content: { application/json: { schema: { $ref: "#/components/schemas/AccountTemplateResult" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /base/accounts/{id}:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      operationId: getBasAccount
      tags: [base]
      responses:
        "200": { description: 会计科目, content: { application/json: { schema: { $ref: "#/components/schemas/Account" } } } }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateBasAccount
      tags: [base]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AccountUpdate" } } } }
      responses:
