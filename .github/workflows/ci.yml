name: CI

# 每次 push 与 pull_request 都跑:后端测试+类型,前端自检+类型+构建。
on:
  push:
  pull_request:

jobs:
  server:
    name: Bun server (typecheck + test + codegen freshness)
    runs-on: ubuntu-latest
    # PG 集成测试门控变量;指向下方 PostgreSQL service。
    env:
      SYNIE_TEST_DATABASE_URL: postgres://synie:synie@localhost:5432/synie_test?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: synie
          POSTGRES_PASSWORD: synie
          POSTGRES_DB: synie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synie -d synie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # monorepo:在仓库根安装全部 workspace(server 不需要 HeroUI 凭证)
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 迁移测试库(Bun 迁移器)
      - name: Migrate test database
        run: bun run db:migrate
        working-directory: server
        env:
          DATABASE_URL: ${{ env.SYNIE_TEST_DATABASE_URL }}

      # 全部测试:单测 + PG 集成(门控变量已设置)
      - name: Test
        run: bun test
        working-directory: server

      - name: Typecheck
        run: bun run typecheck
        working-directory: server

      # Kysely 类型新鲜度:改了 schema/迁移却未重新生成即失败
      - name: Verify DB types are fresh
        run: |
          bun run db:codegen
          git diff --exit-code -- src/db/types.d.ts || {
            echo "DB 类型不是最新的:请运行 bun run db:codegen 并提交生成物"
            exit 1
          }
        working-directory: server
        env:
          DATABASE_URL: ${{ env.SYNIE_TEST_DATABASE_URL }}

  frontend:
    name: Frontend (checks + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # @heroui-pro/react 是私有包,postinstall 需 HEROUI_AUTH_TOKEN 才能拉到真包;
      # 未配置该 secret 时只会装占位包,下面的 tsc / build 会失败(check 步骤不受影响)。
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

      # 纯逻辑自检:不依赖 @heroui-pro,无 token 也能跑。
      - name: Run pure-logic checks
        run: bun run check

      # 纯函数单测(金额大写等):不依赖 @heroui-pro,无 token 也能跑。
      - name: Run unit tests
        run: bun test

      # build / tsc 依赖 @heroui-pro/react 真包 —— 需在仓库配置 HEROUI_AUTH_TOKEN secret,
      # 否则 Pro 仍是占位包,以下两步会失败。
      # build 必须在 tsc 之前:routeTree.gen.ts 是 gitignore 的生成物,由 bun run build
      # (TanStack Router vite 插件)生成,fresh checkout 里不存在;vite/esbuild 只剥类型不做
      # 类型检查,故 build 先跑不会吞掉类型错误,tsc 仍是独立类型门禁。
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

  # 底线 smoke:空库 → 迁移 → 起 server → 最小初始化(scripts/ci-provision.ts) →
  # 关键链路 API 验收(scripts/verify-web-hc-api.ts:登录/主数据 CRUD/销售链/权限拒绝)。
  # 直连 server API,不经 web 代理,因此不需要 HeroUI token / 浏览器 / 前端构建;
  # bun install 无 HEROUI_AUTH_TOKEN 时 @heroui-pro 只装占位包,不影响本 job。
  smoke:
    name: Smoke (migrate + server + critical-path API verify)
    runs-on: ubuntu-latest
    env:
      # 一次性 CI 专用口令,库随 job 销毁,不得复用到其他环境
      DATABASE_URL: postgres://synie:synie@localhost:5432/synie_smoke?sslmode=disable
      AUTH_SECRET: ci-smoke-secret-do-not-use-elsewhere-32b
      PORT: '8091'
      SYNIE_API_URL: http://127.0.0.1:8091/api/v1
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: synie
          POSTGRES_PASSWORD: synie
          POSTGRES_DB: synie_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synie -d synie_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate database
        run: bun run db:migrate
        working-directory: server

      # 后台起 server(日志落文件,失败时倒出便于排查),轮询 healthz 等就绪
      - name: Start server and wait for readiness
        working-directory: server
        run: |
          nohup bun src/index.ts > "$RUNNER_TEMP/synie-server.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "$SYNIE_API_URL/healthz"; then
              echo "server ready (${i}s)"
              exit 0
            fi
            sleep 1
          done
          echo "server 启动超时,日志如下:" >&2
          cat "$RUNNER_TEMP/synie-server.log" >&2
          exit 1

      # 初始化向导最短路径:建超管 + 完成初始化(不写示例数据)
      - name: Provision (setup wizard minimal path)
        run: bun scripts/ci-provision.ts

      # 关键链路验收;脚本自身带就绪等待与请求超时,失败即 job 红
      - name: Verify critical-path API
        run: bun scripts/verify-web-hc-api.ts
