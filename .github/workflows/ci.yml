name: CI

on:
  push:
  pull_request:

env:
  CONVEX_VERSION: 19431ea0dd90bc55ae58dbbd06d9aa045f97336f

jobs:
  static:
    name: Shared / Convex / Web static gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: Reject committed private keys
        run: |
          if git grep -nE 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|AKIA[0-9A-Z]{16}' -- .; then
            echo '检测到疑似私钥或长期云密钥'
            exit 1
          fi

      - name: Architecture and generated-source gates
        run: bun run check

      - name: Build Web artifact
        run: bun run build
        env:
          VITE_CONVEX_URL: http://127.0.0.1:3210
          VITE_CONVEX_SITE_URL: http://127.0.0.1:3211
          VITE_SITE_URL: http://127.0.0.1:3000

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

  convex-infra:
    name: Self-hosted Convex infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: synie-convex-ci
      AWS_ACCESS_KEY_ID: synie-ci
      AWS_SECRET_ACCESS_KEY: synie-ci-development-only
      CONVEX_POSTGRES_PASSWORD: convex-ci-development-only
      SYNIE_PRODUCT_FILES_CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Start and verify target infrastructure
        run: bun run infra:up

      - name: Verify idempotent MinIO bootstrap
        run: |
          docker compose run --rm --no-deps minio-init init
          bun run infra:health

      - name: Verify MinIO fail-closed checks
        run: |
          if docker compose run --rm --no-deps \
            -e MINIO_ROOT_PASSWORD=definitely-wrong \
            minio-init verify; then
            echo '错误凭据不应通过 bucket 验证'
            exit 1
          fi

      - name: Verify log sanitizer
        run: |
          printf '%s\n' \
            'AWS_SECRET_ACCESS_KEY=synie-ci-development-only' \
            'CONVEX_SELF_HOSTED_ADMIN_KEY=convex-self-hosted|secret-secret-secret-secret' \
            | bun infra/convex/sanitize-logs.ts > sanitized.log
          ! grep -q 'synie-ci-development-only' sanitized.log
          ! grep -q 'secret-secret-secret-secret' sanitized.log

      - name: Confirm PostgreSQL and S3 backends
        run: |
          logs="$(docker compose logs --no-color convex-backend)"
          test "$(printf '%s' "$logs" | grep -c 'Connected to Postgres database: convex-self-hosted')" -ge 1
          test "$(printf '%s' "$logs" | grep -c 'S3 .* storage is configured')" -ge 1
          if printf '%s' "$logs" | grep -Eqi 'falling back to local storage|SQLite'; then
            echo 'Convex 意外回退到 local storage/SQLite'
            exit 1
          fi

      - name: Capture sanitized logs
        if: failure()
        run: docker compose logs --no-color | bun infra/convex/sanitize-logs.ts > convex-compose.log

      - name: Upload sanitized logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: convex-infra-logs
          path: convex-compose.log

      - name: Stop infrastructure without deleting volumes
        if: always()
        run: docker compose down --remove-orphans

  convex-auth:
    name: Self-hosted auth and IAM smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:self-hosted-auth

  convex-resources:
    name: Self-hosted resource plane smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:self-hosted-resources

  convex-engines:
    name: Ledger / inventory / projection smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:self-hosted-engines

  storage-restore:
    name: S3 compatibility and restore drill
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: synie-restore-source-ci
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:s3-compat
      - name: Prepare restore source deployment
        run: |
          bun run infra:up
          bun run convex:bootstrap
      - name: Run portable restore drill
        run: bun run test:self-hosted-restore
      - name: Stop restore source deployment without deleting volumes
        if: always()
        run: bun run infra:down

  printing:
    name: Production Web / LibreOffice printing smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:printing-self-hosted
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
