name: CI

# 每次 push 与 pull_request 都跑:后端测试+格式,前端自检+类型+构建。
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (format + test)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      # test 环境的 repo_config 优先读 DATABASE_URL;端口用 service 映射出的 5432。
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/synie_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          elixir-version: "1.20"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Set up test database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Run tests
        run: mix test

  server:
    name: Go server (lint + test + codegen freshness)
    runs-on: ubuntu-latest
    # PG 集成测试的门控变量:指向下方 PostgreSQL service;版本与 compose.yaml 对齐。
    env:
      SYNIE_TEST_DATABASE_URL: postgres://synie:synie@localhost:5432/synie_test?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: synie
          POSTGRES_PASSWORD: synie
          POSTGRES_DB: synie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synie -d synie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # working-directory 为 server-go:Makefile 目标与 gofmt 检查都只覆盖 server-go/;
    # 生成步骤依赖 ../contracts/openapi/openapi.yaml,检出的是完整仓库,相对路径成立。
    defaults:
      run:
        working-directory: server-go
    steps:
      - uses: actions/checkout@v4

      # Go 版本取自 server-go/go.mod 的 go 指令;按 server-go/go.sum 缓存模块与构建缓存。
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server-go/go.mod
          cache-dependency-path: server-go/go.sum

      # gofmt -l 为空 + go vet,与本地 make lint 同源。
      - name: Lint (gofmt + go vet)
        run: make lint

      # PG 集成测试需要已迁移的测试库:service 健康检查通过后跑 goose 迁移。
      - name: Migrate test database
        run: make migration-up
        env:
          DATABASE_URL: ${{ env.SYNIE_TEST_DATABASE_URL }}

      # 带 SYNIE_TEST_DATABASE_URL 运行:PG 集成测试在真实 PostgreSQL 上执行,
      # 不再 Skip;无该变量的本地 make test 体验不变(门控 Skip)。
      - name: Test
        run: make test

      # 重新执行代码生成(oapi-codegen + sqlc,工具版本见 server/Makefile 的 pin),
      # 生成物目录有 diff 即失败 —— 防止改了 OpenAPI/查询 SQL 却忘记重新生成。
      - name: Verify generated code is fresh
        run: make verify-codegen

  server-ts:
    name: Bun server (typecheck + test + codegen freshness)
    runs-on: ubuntu-latest
    # PG 集成测试门控变量;与 server-go 相同的真库集成策略。
    env:
      SYNIE_TEST_DATABASE_URL: postgres://synie:synie@localhost:5432/synie_test?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: synie
          POSTGRES_PASSWORD: synie
          POSTGRES_DB: synie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U synie -d synie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # monorepo:在仓库根安装全部 workspace(server 不需要 HeroUI 凭证)
      - name: Install dependencies
        run: bun install

      # 迁移测试库(Bun 迁移器,SQL 与 server-go 同源)
      - name: Migrate test database
        run: bun run db:migrate
        working-directory: server
        env:
          DATABASE_URL: ${{ env.SYNIE_TEST_DATABASE_URL }}

      # 全部测试:单测 + PG 集成(门控变量已设置)
      - name: Test
        run: bun test
        working-directory: server

      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: server

      # Kysely 类型新鲜度:改了 schema/迁移却未重新生成即失败
      - name: Verify DB types are fresh
        run: |
          bun run db:codegen
          git diff --exit-code -- src/db/types.d.ts || {
            echo "DB 类型不是最新的:请运行 bun run db:codegen 并提交生成物"
            exit 1
          }
        working-directory: server
        env:
          DATABASE_URL: ${{ env.SYNIE_TEST_DATABASE_URL }}

  frontend:
    name: Frontend (checks + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # @heroui-pro/react 是私有包,postinstall 需 HEROUI_AUTH_TOKEN 才能拉到真包;
      # 未配置该 secret 时只会装占位包,下面的 tsc / build 会失败(check 步骤不受影响)。
      - name: Install dependencies
        run: bun install
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

      # 纯逻辑自检:不依赖 @heroui-pro,无 token 也能跑。
      - name: Run pure-logic checks
        run: bun run check

      # 纯函数单测(金额大写等):不依赖 @heroui-pro,无 token 也能跑。
      - name: Run unit tests
        run: bun test

      # build / tsc 依赖 @heroui-pro/react 真包 —— 需在仓库配置 HEROUI_AUTH_TOKEN secret,
      # 否则 Pro 仍是占位包,以下两步会失败。
      # build 必须在 tsc 之前:routeTree.gen.ts 是 gitignore 的生成物,由 bun run build
      # (TanStack Router vite 插件)生成,fresh checkout 里不存在;vite/esbuild 只剥类型不做
      # 类型检查,故 build 先跑不会吞掉类型错误,tsc 仍是独立类型门禁。
      - name: Build
        run: bun run build

      - name: Typecheck
        run: bunx tsc --noEmit
