name: synie

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: synie
      POSTGRES_USER: synie
      POSTGRES_PASSWORD: synie
    ports:
      - "5441:5432"
    volumes:
      - synie-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synie -d synie"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ./server
    command:
      - /usr/local/bin/goose
      - -dir
      - /app/db/migrations
      - postgres
      - postgres://synie:synie@postgres:5432/synie?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ./server
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://synie:synie@postgres:5432/synie?sslmode=disable
      AUTH_SECRET: local-development-secret-change-me-32-bytes
      AUTH_TOKEN_TTL: 168h
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed:
    build:
      context: ./server
    command: ["/usr/local/bin/synie-seed"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://synie:synie@postgres:5432/synie?sslmode=disable
      AUTH_SECRET: local-development-secret-change-me-32-bytes
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: local-admin-password-change-me
      SEED_ADMIN_NAME: 系统管理员
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  synie-postgres:
