name: synie

# 产品栈：PostgreSQL + Bun/TS server（Hono）+ 可选 seed。
# 前端 Vite 代理默认目标 localhost:8080。

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: synie
      POSTGRES_USER: synie
      POSTGRES_PASSWORD: synie
    ports:
      - "5441:5432"
    volumes:
      - synie-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synie -d synie"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["bun", "db/migrate.ts"]
    environment:
      DATABASE_URL: postgres://synie:synie@postgres:5432/synie?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      DATABASE_URL: postgres://synie:synie@postgres:5432/synie?sslmode=disable
      AUTH_SECRET: local-development-secret-change-me-32-bytes
      AUTH_TOKEN_TTL: 168h
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  seed:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["bun", "db/seed.ts"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://synie:synie@postgres:5432/synie?sslmode=disable
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: admin123
      SEED_ADMIN_NAME: 系统管理员
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  synie-postgres:
